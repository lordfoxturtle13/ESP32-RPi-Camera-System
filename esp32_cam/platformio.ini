[env:esp32cam]
platform = espressif32@6.5.0  ; FONTOS: Ez a stabil verzió (Arduino Core 2.0.14)
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

board_build.partitions = huge_app.csv ; Hogy biztosan elférjen a kód

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3 ; Info szintű logolás, 0-ra állítsd ha kész vagy
    -DCAMERA_MODEL_AI_THINKER