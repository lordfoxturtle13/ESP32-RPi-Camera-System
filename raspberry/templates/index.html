<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>ŐRSzem — Kamera Rendszer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Fejléc: márka, nézetek, kijelentkezés -->
    <header class="topbar">
        <span class="brand-name">ŐRSzem</span>
        <nav class="tabs">
            <button class="tab active" id="nav-live" onclick="showView('live')">Élőkép</button>
            <button class="tab" id="nav-archive" onclick="showView('archive')">Archívum</button>
            <button class="tab" id="nav-events" onclick="showView('events')">Eseménynapló</button>
        </nav>
        <form method="POST" action="/logout">
            <button type="submit" class="logout-btn">Kijelentkezés</button>
        </form>
    </header>

    <!-- Tárhely- vagy felvételi hiba: csak akkor látszik, ha a szerver jelzi -->
    <div id="storage-alert" class="storage-alert hidden" role="alert"></div>

    <main>

        <!-- ÉLŐKÉP -->
        <section id="view-live" class="view">
            <div class="camera-grid">
                {% for cam_id, cam in cameras.items() %}
                <div class="camera-card" id="card-{{ cam_id }}">
                    <div class="card-header">
                        <span class="cam-status-dot" id="dot-{{ cam_id }}"></span>
                        <span class="cam-name">{{ cam.name }}</span>
                        <span class="cam-id">CAM{{ "%02d"|format(cam_id) }}</span>
                        <button class="btn-record" id="record-btn-{{ cam_id }}" onclick="toggleRecord({{ cam_id }})">Felvétel</button>
                    </div>
                    <div class="feed-wrapper">
                        <img class="camera-feed" data-cam-id="{{ cam_id }}" alt="{{ cam.name }}">
                        <!-- A JS mutatja, ha a kamera nem elérhető -->
                        <div class="signal-overlay" id="overlay-{{ cam_id }}">NINCS JEL</div>
                        <div class="rec-indicator" id="rec-indicator-{{ cam_id }}">● REC</div>
                    </div>
                </div>
                {% else %}
                <p class="empty-msg">Nincs kamera. A kamerákat a config.json-ban lehet megadni.</p>
                {% endfor %}
            </div>
        </section>

        <!-- ARCHÍVUM -->
        <section id="view-archive" class="view hidden">
            <div class="archive-layout">
                <div class="panel">
                    <h2 class="panel-title">Felvételek</h2>
                    <div id="video-list" class="video-list">
                        <p class="empty-msg">Betöltés...</p>
                    </div>
                </div>

                <div class="panel">
                    <h2 class="panel-title" id="player-title">Válassz felvételt</h2>
                    <div class="player-wrapper">
                        <!-- Főstream: nagy felbontás, vezérlőkkel -->
                        <video id="archive-player" class="main-player" controls preload="none">
                            Nem támogatott formátum.
                        </video>
                        <!-- Al-stream: gyors tekerés előnézete (seeking közben látható) -->
                        <video id="archive-player-sub" class="sub-player" muted preload="none"></video>
                    </div>
                </div>
            </div>
        </section>

        <!-- ESEMÉNYNAPLÓ -->
        <section id="view-events" class="view hidden">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Eseménynapló</h2>
                    <button class="small-btn" onclick="loadEvents()">Frissítés</button>
                </div>
                <div id="events-list" class="events-list">
                    <p class="empty-msg">Betöltés...</p>
                </div>
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
