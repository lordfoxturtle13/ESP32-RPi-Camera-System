<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera projekt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>

<body>
    <div class="sidebar">
        <h2>Menü</h2>
        <div class="menu-item" onclick="showLive()">Élő Kép</div>
        <div class="menu-item" onclick="showArchive()">Archívum</div>
        <div class="menu-item">Beállítások</div>
    </div>

    <div class="main-content">
        <div class="header-controls">
            <button class="hamburger-btn" onclick="toggleSidebar()">☰ Menü</button>
        </div>

        <div id="live-view" style="width: 100%;">
            <h1 style="text-align: center; color: var(--accent-color); margin-top: 0;">Központi Kamera Rendszer</h1>

            <div class="global-controls">
                <button id="record-all-btn" class="btn btn-global-record" onclick="toggleAllRecords()">
                    🔴 Összes Felvétele
                </button>
            </div>

            <div class="camera-grid">
                {% for camera_id in cameras %}
                <div class="camera-card">

                    <div class="card-header">
                        <h3 class="camera-title">Kamera: {{ camera_id }}</h3>
                        <div class="card-actions">
                            <button id="record-btn-{{ camera_id }}" class="btn btn-record"
                                onclick="toggleRecord('{{ camera_id }}')">
                                ⏺ Felvétel
                            </button>
                            <button class="btn btn-reset" onclick="resetCamera('{{ camera_id }}')"
                                title="Újracsatlakozás">
                                🔄
                            </button>
                        </div>
                    </div>

                    <div class="feed-container">
                        <img src="{{ url_for('video_feed', camera_id=camera_id) }}" id="feed-{{ camera_id }}"
                            class="camera-feed" onclick="toggleFullScreen(this)" alt="Élő stream ({{ camera_id }})">
                    </div>

                </div>
                {% endfor %}
            </div>
        </div>

        <div id="archive-view" class="hidden"
            style="width: 100%; display: flex; flex-direction: column; gap: 20px; align-items: center;">
            <h2 style="color: var(--accent-color); margin-top: 0;">Mentett felvételek</h2>

            <div id="video-list" class="video-list-grid"></div>

            <div id="player-container" class="hidden" style="width: 100%; max-width: 1000px; margin: 0 auto;">
                <video id="archive-player" controls
                    style="width: 100%; border-radius: 4px; border: 1px solid var(--border-color);"></video>
            </div>
        </div>

    </div><script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
